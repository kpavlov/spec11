name: build
on:
  push:
    branches: [main]
  pull_request:
    # code, specs (the dogfood scan reads them) and build inputs only; not docs, README, Formula, bench
    paths:
      - core/**
      - server/**
      - web/**
      - skills/**
      - specs/**
      - docs/static/tokens.css # symlinked into web/src
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - spec17.json
      - .spec17ignore
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          ## - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from `packageManager` in web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cd web && pnpm install --frozen-lockfile && pnpm run check
      - run: cargo test --workspace --locked
      # release build embeds web/dist (build.rs runs pnpm); the release-only embedded-UI test runs here too
      - run: cargo test --release --workspace --locked
      - run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: spec17-${{ matrix.os }}
          path: dist/*.tar.gz
