[package]
name = "spec11"
version.workspace = true
edition.workspace = true
description = "CLI, MCP (streamable HTTP) server and web dashboard for spec-driven-development evidence."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
spec11-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
